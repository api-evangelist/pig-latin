aid: pig-latin
name: Pig Latin
description: >-
  Pig Latin is a language game in which English words are altered according to a
  simple set of rules (typically moving the first consonant cluster to the end of
  the word and appending "ay"). This repository indexes Pig Latin as a topic; no
  authoritative public REST API or OpenAPI specification has been identified, so
  no machine-readable contract is published here.
